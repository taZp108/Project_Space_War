<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050907" />
    <meta name="description" content="Space War — game chiến thuật không gian hai người chơi." />
    <title>SPACE WAR // Giao diện chiến thuật</title>
    <link rel="stylesheet" href="style.css" />
    <script src="mock-data.js" defer></script>
    <script src="mock-lobby.js" defer></script>
    <script src="mock-actions.js" defer></script>
    <script src="game-adapter.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Thanh tiêu đề ứng dụng">
        <a class="brand" href="#home" data-screen="home" aria-label="Về trang chủ Space War">
          <span class="brand-mark" aria-hidden="true">SW</span>
          <span class="brand-copy"><strong>SPACE WAR</strong><span>GIAO DIỆN CHIẾN THUẬT</span></span>
        </a>
        <div class="topbar-status" role="status" aria-live="polite">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="runtime-status">GIAO DIỆN SẴN SÀNG</span>
          <span class="topbar-divider" aria-hidden="true"></span>
          <span class="build-label">KHUNG GIAO DIỆN / 10</span>
        </div>
        <div class="topbar-meta"><span class="meta-label">MẠNG</span><span class="status-text">NGOẠI TUYẾN</span></div>
      </header>

      <main id="main" class="main-layout screen-root" tabindex="-1" aria-live="polite"></main>

      <footer class="footer-bar">
        <span>GIAO DIỆN ĐIỀU KHIỂN <span class="footer-slash">/</span> CHẾ ĐỘ THỬ</span>
        <span>HỆ THỐNG <span class="footer-state">CỤC BỘ</span></span>
        <span class="footer-version">SPACE WAR <span>—</span> UI 0.10</span>
      </footer>
    </div>
  </body>
</html>
